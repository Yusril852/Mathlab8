<script>
/* ===== DATA: struktur bab/sub-bab Kelas 8 ===== */
const B=[['Bilangan Berpangkat','Bilangan Berpangkat Bulat|Bilangan Bentuk Akar|Penulisan Bentuk Baku'],
['Teorema Pythagoras','Menemukan Konsep Pythagoras|Tripel Pythagoras|Segitiga Istimewa|Penerapan Teorema Pythagoras|Rumus Jarak (Pengayaan)'],

['Statistika','Pemusatan Data|Penyebaran Data']
].map(([n,s],i)=>({n,i,s:s.split('|')}));
const IC=['🔢','📐','⚖️','🔗','📈','📊'],LN=['','Dasar','Menengah','Lanjutan'];

/* ===== QUESTION GENERATOR: template + parameter + seeded RNG. Kunci "bab.sub" (0-based) ===== */
const sup=n=>String(n).replace(/-/g,'⁻').replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]),gcd=(a,b)=>b?gcd(b,a%b):a,fr=(n,d)=>{const g=gcd(n,d);return d/g==1?''+n/g:n/g+'/'+d/g};
const cf=n=>n==1?'':n,fz=c=>c>=0?`+ ${c}`:`− ${-c}`,Rot=(t,x,y)=>t==0?pt(x,y):t==90?pt(-y,x):t==180?pt(-x,-y):pt(y,-x);

const hash=s=>[...s].reduce((h,c)=>Math.imul(h^c.charCodeAt(0),16777619),2166136261);
const SV=(w,h,c)=>`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;color:var(--ink);font:700 13px Nunito,sans-serif" role="img">${c}</svg>`;
const tx=(x,y,t,a='middle',c='currentColor')=>`<text x="${x}" y="${y}" text-anchor="${a}" fill="${c}">${t}</text>`;

function plane(items){const S=20,O=170,X=x=>O+S*x,Y=y=>O-S*y;let g='';for(let i=-8;i<=8;i++)g+=ln(X(i),10,X(i),330,'currentColor',1)+ln(10,Y(i),330,Y(i),'currentColor',1);
 g=`<g opacity=".15">${g}</g>`+ln(10,O,330,O)+ln(O,10,O,330)+[-6,-4,-2,2,4,6].map(i=>tx(X(i),O+14,i)+tx(O-8,Y(i)+4,i,'end')).join('')+tx(O+8,O+14,0,'start');
